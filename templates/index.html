<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culturoù - Où se trouve la culture</title>


    <!-- Tailwind CSS pour la mise en page -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />


</head>

<body>

    <!-- Barre de navigation -->
    <nav class="top-bar h-16 flex items-center justify-between px-6 relative z-50">
        <div class="flex items-center gap-3">
            <span class="logo-dot"></span>
            <h1 class="text-2xl font-bold tracking-tight logo-text">
                Culturoù
            </h1>
        </div>

        <button id="menu-toggle" class="menu-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
            </svg>
        </button>
    </nav>


    <!-- Zone principale -->
    <main class="relative flex">

        <!-- Emplacement de la carte -->
        <div id="map">
            <!-- Votre carte sera injectée ici -->
        </div>

        <!-- Menu de filtrage -->
        <aside id="side-menu">
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800">Filtres culturels</h2>
            </div>

            <div class="space-y-3">
                <label class="filter-item">
                    <input type="checkbox" class="category-checkbox w-5 h-5 text-indigo-600 rounded"
                        value="Monument historique" checked>
                    <span class="ml-4 text-gray-700 font-medium">Monument historique</span>
                </label>

                <label class="filter-item">
                    <input type="checkbox" class="category-checkbox w-5 h-5 text-indigo-600 rounded"
                        value="Lieu de culte" checked>
                    <span class="ml-4 text-gray-700 font-medium">Lieu de culte</span>
                </label>

                <label class="filter-item">
                    <input type="checkbox" class="category-checkbox w-5 h-5 text-indigo-600 rounded" value="Musée"
                        checked>
                    <span class="ml-4 text-gray-700 font-medium">Musée</span>
                </label>

                <label class="filter-item">
                    <input type="checkbox" class="category-checkbox w-5 h-5 text-indigo-600 rounded" value="Street art"
                        checked>
                    <span class="ml-4 text-gray-700 font-medium">Street art</span>
                </label>

            </div>

            <div class="mt-10 p-4 bg-indigo-50 rounded-lg text-indigo-800 text-sm italic">
                Cochez une catégorie pour explorer les trésors culturels.
            </div>
        </aside>

    </main>

    <script>
        // Gestionnaire d'affichage du menu uniquement
        const menuToggle = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');

        menuToggle.addEventListener('click', () => {
            sideMenu.classList.toggle('menu-closed');
        });

        // Fermeture automatique du menu sur petits écrans
        if (window.innerWidth < 1024) {
            sideMenu.classList.add('menu-closed');
        }
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- App JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
